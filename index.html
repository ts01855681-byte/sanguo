  for(const s of Object.values(S.a_seqs))s.forEach(c=>APOOL.add(c));
  for(const s of Object.values(S.b_seqs))s.forEach(c=>BPOOL.add(c));
  ALLPOOL=[...APOOL,...BPOOL];
  danEl.textContent=S.label;danEl.className='d'+k;
  q.disabled=false;q.placeholder=S.placeholder;
  pick.classList.add('hide');
  log.innerHTML='';
  add('a',S.intro);
}
document.querySelectorAll('.big').forEach(b=>b.onclick=()=>choose(b.dataset.k));
document.getElementById('sw').onclick=()=>{pick.classList.remove('hide')};
function isHiA(c){return c in S.a_high}
function isHiB(c){return S.b_high.indexOf(c)>=0}
function resolve(tok){
  tok=tok.trim();if(!tok)return null;
  if(AL[tok])tok=AL[tok];
  if(APOOL.has(tok)||BPOOL.has(tok))return{ok:tok};
  const cand=[...new Set(ALLPOOL.filter(c=>c.includes(tok)))];
  if(cand.length===1)return{ok:cand[0]};
  if(cand.length>1)return{amb:cand.slice(0,8)};
  return{bad:tok};
}
function pileEnd(ver,pos){ // 該版本此位置所在捆的最後一張位置（只有已驗證捆結構的彈才算）
  if(!S.bundle)return null;
  const p=S.phases[ver];if(p===undefined)return null;
  const k=Math.ceil((pos-(p-1))/S.bundle);return (p-1)+S.bundle*k;
}
function tag(c,zone){ // 有標價顯示 ($價)，沒標價(例：6彈只給名單)顯示 ⭐
  if(zone==='A'){const p=S.a_high[c];return p?'($'+p+')':'⭐'}
  return '⭐';
}
function fmt(c,zone){
  if((zone==='A'&&isHiA(c))||(zone==='B'&&isHiB(c)))return'<span class="hi">'+c+tag(c,zone)+'</span>';
  return c;
}
function search(cards){
  const out=[];
  const scan=(seqs,zone)=>{
    for(const[ver,s]of Object.entries(seqs)){
      for(let i=0;i+cards.length<=s.length;i++){
        let hit=true;
        for(let j=0;j<cards.length;j++)if(s[i+j]!==cards[j]){hit=false;break}
        if(hit)out.push({zone,ver,pos:i+1,last:i+cards.length,seq:s,skipped:[]});
      }
    }
  };
  scan(S.a_seqs,'A');scan(S.b_seqs,'B');
  if(out.length)return out;
  // 沒有連續匹配 → 容許「略過跳點卡」再找一次（6彈規則：跳點那張不一定會出現）
  const scan2=(seqs,zone,jm)=>{
    for(const[ver,s]of Object.entries(seqs)){
      const J=new Set(((jm||{})[ver])||[]);if(!J.size)continue;
      for(let i=0;i<s.length;i++){
        if(s[i]!==cards[0])continue;
        let k=i+1,ok=true;const skipped=[];
        for(let j=1;j<cards.length;j++){
          if(k<s.length&&s[k]===cards[j]){k++;continue}
          if(J.has(k+1)&&k+1<s.length&&s[k+1]===cards[j]){skipped.push(k+1);k+=2;continue}
          ok=false;break;
        }
        if(ok&&skipped.length)out.push({zone,ver,pos:i+1,last:k,seq:s,skipped});
      }
    }
  };
  scan2(S.a_seqs,'A',S.a_jumps);scan2(S.b_seqs,'B',S.b_jumps);
  return out;
}
function render(cards,ms){
  if(!ms.length){add('a','❌ '+S.label+'裡找不到「'+cards.join(' → ')+'」連續出現的位置。\n• 確認卡名/順序\n• 是不是選錯彈？右上角可切換\n'+(S.bundle?'• 可能正好跨捆界（前後卡分屬兩捆）→ 改報最新2張':'• 可能剛碰到跳點（連兩張同類）→ 改報最新2張'));return}
  if(ms.length>6){add('a','⚠️ 有 '+ms.length+' 處匹配，太多了。請再多報下一張卡（共'+(cards.length+1)+'張）縮小範圍。');return}
  for(const m of ms){
    const last=m.last;
    const J=((m.zone==='A'?S.a_jumps:S.b_jumps)||{})[m.ver]||[];
    const nxt=[];let hiDist=null,hiCard=null;
    for(let d=1;last-1+d<m.seq.length&&d<=12;d++)nxt.push(m.seq[last-1+d]);
    for(let d=1;last-1+d<m.seq.length;d++){const c=m.seq[last-1+d];
      if((m.zone==='A'&&isHiA(c))||(m.zone==='B'&&isHiB(c))){hiDist=d;hiCard=c;break}}
    let h='📍 <b>'+S.label+'·'+(m.zone==='A'?'A槽·':'B槽·')+m.ver+'</b> 第'+m.pos+'~'+last+'張（共'+m.seq.length+'張）\n';
    if(m.skipped.length)h+='<span class="warn">↳ 用「略過跳點卡」才對到的：機台跳過了'+m.skipped.map(p=>'第'+p+'張「'+m.seq[p-1]+'」').join('、')+'</span>\n';
    const pe=m.zone==='A'?pileEnd(m.ver,last):null;
    h+='👉 接下來：'+(nxt.length?nxt.map((c,i)=>{
      let t=fmt(c,m.zone);const p=last+1+i;
      if(pe&&p===pe+1)t='｜⚠捆界｜'+t;
      if(J.indexOf(p)>=0)t='｜⚠跳點｜'+t;
      return t;}).join('、'):'(已到此表結尾)')+'\n';
    if(hiCard)h+='💰 最近高價卡：<span class="hi">'+hiCard+tag(hiCard,m.zone)+'</span> 再 <b class="st">'+hiDist+'</b> 張\n';
    else h+='💰 此表後面已無高價卡\n';
    if(pe&&pe-last<=12)h+='<span class="warn">⚠ 第'+pe+'張後換捆（'+(pe-last)+'張後）：之後順序可能對不上，到時重報2張</span>\n';
    const nj=J.find(p=>p>last);
    if(nj&&nj-last<=12)h+='<span class="warn">⚠ 第'+nj+'張「'+m.seq[nj-1]+'」是跳點（'+(nj-last)+'張後）：這張可能不出現、之後順序可能對不上，到時重報2張</span>\n';
    h+='<span class="sub">'+(S.bundle?'對不上＝換捆或跳卡，直接再報最新2張':'對不上＝碰到跳點或表有誤，直接再報最新2張')+'</span>';
    add('a',h);
  }
}
function go(){
  if(!S){pick.classList.remove('hide');return}
  const raw=q.value.trim();if(!raw)return;
  add('u',raw);q.value='';
  const toks=raw.split(/[\s,，、>＞→/／]+/).filter(Boolean);
  if(toks.length<2){add('a','請至少連報 2 張卡（中間空格隔開），3 張更準。');return}
  const cards=[];
  for(const t of toks){
    const r=resolve(t);
    if(!r){continue}
    if(r.bad){add('a','❓ '+S.label+'裡不認識「'+r.bad+'」，檢查一下字，或看看是不是選錯彈。');return}
    if(r.amb){add('a','「'+t+'」有多個可能：\n'+r.amb.map(c=>'<span class="chip">'+c+'</span>').join('')+'\n請打完整一點。');return}
    cards.push(r.ok);
  }
  render(cards,search(cards));
}
document.getElementById('go').onclick=go;
q.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
document.querySelector('header small').textContent='連報2~3張卡 ｜ 資料版本 '+D.updated;
</script></body></html>
